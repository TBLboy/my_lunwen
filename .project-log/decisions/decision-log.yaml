- id: DEC-012
  title: Use fixed in-column placement for Figures 4 and 5
  category: process
  status: active
  authority: B
  user_approval: not-required
  related_tasks:
  - TASK-032
  related_business_logic: []
  context: The user requires Figures 4 and 5 to be single-column and inserted directly at the corresponding points in the manuscript.
  hypothesis: A fixed in-column environment that bypasses CAS float queues will keep both figures in the intended text flow while preserving a nine-page document.
  options:
  - name: Use fixed in-column figurehere environment
    benefits:
    - Honors the user's exact placement requirement.
    - Prevents deferred figures at the end of the manuscript.
    costs:
    - A fixed figure can create local whitespace when it does not fit the current column.
    risks:
    - Later text edits can move the surrounding content and require another visual check.
  - name: Keep float placement
    benefits:
    - Lets LaTeX optimize page fill.
    costs:
    - Cannot guarantee that each figure appears at its corresponding text position.
    risks:
    - Figures may be deferred.
  decision: Define a local figurehere environment using float's fixed-placement primitives and use it for Figures 4 and 5 at column width.
  reason_summary:
  - The CAS class redefines the standard figure environment and does not honor [H] through the normal interface.
  - Fixed placement matches the user's explicit layout requirement.
  action: Update main.tex and manuscript_body.tex, rebuild, inspect labels, and render the affected pages.
  expected_result: Figure 4 appears in a single column on page 6 and Figure 5 on page 7, with the manuscript still nine pages.
  reversal_plan: Restore the standard CAS figure environment and float placement if later content requires automatic page filling.
  observation: The forced build produced a nine-page PDF; Figure 4 resolves to page 6 and Figure 5 resolves to page 7.
  actual_result: Both figures are single-column and non-floating at their corresponding discussion points, with no undefined references or fatal errors.
  outcome_status: successful
  lesson: In the CAS class, use a local fixed-placement environment rather than the standard [H] option because the class consumes figure placement as key-value options.
