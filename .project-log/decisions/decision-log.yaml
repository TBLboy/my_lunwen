    risks:
    - 只能依靠汇总 RMSE/MAE 判断控制性能
  decision: Figure 4 使用螺旋替代圆形，并采用上排轨迹、下排误差的两排布局；误差定义为 `e(t)=||p_k-p_k^ref||_2`。
