- id: DEC-015
  title: Use a citation-order bibliography style
  category: technical
  status: superseded
  authority: B
  user_approval: not-required
  related_tasks:
  - TASK-037
  related_business_logic: []
  context: The CAS template bibliography style `cas-model2-names` explicitly sorts entries by author, title, and bibliographic key, so citation numbers are not assigned according to first appearance in the manuscript.
  hypothesis: A natbib-compatible unsorted bibliography style will produce sequential numbered citations and preserve the CAS double-column layout.
  options:
  - name: Switch to unsrtnat
    benefits:
    - Numbers references by first citation occurrence.
    - Reuses a maintained BibTeX style already available in the TeX distribution.
    - Avoids manually maintaining a custom bibliography order.
    costs:
    - Reference punctuation and author formatting follow the standard natbib style rather than the CAS bibliography style.
    risks:
    - The publisher may reformat references at proof stage, but submission ordering remains compliant.
  - name: Modify the CAS bibliography style
    benefits:
    - Preserves CAS-specific reference formatting.
    costs:
    - Requires maintaining a large custom BibTeX style and its duplicate-year label logic.
    risks:
    - A local style edit is harder to review and may diverge from the publisher template.
  decision: Use `unsrtnat` for the manuscript bibliography so references are numbered and listed by first citation occurrence.
  reason_summary:
  - RAS instructs authors to number references in citation order.
  - The existing CAS style sorts by author and title.
  - The standard unsorted natbib style satisfies the ordering requirement with a one-line change.
  action: Change the bibliography style in `main.tex`, rebuild the manuscript, compare the first-citation order in `main.aux` with the bibliography order in `main.bbl`, and inspect the Introduction and bibliography pages.
  expected_result: Introduction citations are numbered sequentially by first appearance, the bibliography follows the same order, and the manuscript remains nine pages without warnings.
  reversal_plan: Restore `cas-model2-names` if the journal requires the CAS bibliography formatting at submission or proof stage.
  observation: The clean build is nine pages with no strict-warning matches; the first-citation sequence and all 25 bibliography keys match exactly.
  actual_result: The Introduction begins with sequential groups [1,2], [3], [4-7], [8,9], and so on, with repeats only where later sections cite earlier references.
  outcome_status: successful
  lesson: For numbered journals, verify bibliography style behavior rather than assuming that a template's default `.bst` uses citation order.
  evidence:
  - EV-056
  supersedes: []
  created_at: '2026-09-19T06:28:00Z'
  updated_at: '2026-09-19T12:40:00Z'
