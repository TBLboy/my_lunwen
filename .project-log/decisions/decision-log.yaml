- id: DEC-010
  title: RAS 修订采用 9 页内部目标并冻结实验物理体量
  category: process
  status: active
  authority: C
  user_approval: approved
  related_tasks:
  - TASK-029
  - TASK-030
  related_business_logic:
  - BL-PAPER-001
  context: RAS 官方指南没有 8 页硬限制，当前 CAS 主稿因独立 Highlights 页和延迟全宽浮图页达到 11 页。用户同时要求增加软体平台内容，但不允许实验部分相对旧论文扩大体量。
  hypothesis: 将主稿内部目标放宽到 9 页，并把 Highlights 改为独立提交、压缩最后一张浮图，可以在不删减软体平台内容的前提下达到目标。
  options:
  - name: 9 页以内并冻结实验体量
    benefits:
    - 符合用户对篇幅和内容密度的要求
    - 允许通过布局迭代而非删减核心内容解决页数
    costs:
    - 需要反复调整图片和实验排版
    risks:
    - 若图片缩放过度，可读性下降
  - name: 继续坚持 8 页
    benefits:
    - 版式更紧凑
    costs:
    - 需要进一步压缩正文或图表
    risks:
    - 软体平台新增内容可能难以清晰呈现
  - name: 取消页数目标
    benefits:
    - 排版自由
    costs:
    - 与用户明确的投稿控制目标不一致
    risks:
    - 实验部分体量膨胀
  decision: 采用 9 页以内作为 RAS 主稿内部目标；Highlights 独立提交，不计入主稿页数；实验部分内容可以增加，但相对旧论文的物理体量不得增加。
