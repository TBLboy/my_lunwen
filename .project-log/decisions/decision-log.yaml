- id: DEC-011
  title: Use explicit top placement for Figure 2 and Figure 3 in the CAS manuscript
  category: process
  status: active
  authority: B
  user_approval: not-required
  related_tasks:
  - TASK-031
  related_business_logic: []
  context: The controller-structure figure and Geomagic Touch equipment figure were deferred away from their corresponding sections by the CAS double-column float queue.
  hypothesis: Explicit top placement for both figures will keep them on the next available page near their referenced text without changing figure content or the nine-page layout.
  options:
  - name: Explicit top placement
    benefits:
    - Keeps figures close to Sections 4.1 and 5.1.
    - Preserves content, captions, labels, and the nine-page target.
    costs:
    - Figure placement remains dependent on the page break after a forced rebuild.
    risks:
    - Dense text may move a following page break in later revisions.
  - name: Force exact-here placement
    benefits:
    - Makes the figure position deterministic.
    costs:
    - Can create large whitespace gaps and interfere with two-column flow.
    risks:
    - May increase page count.
  decision: Set both figures to the CAS top-placement option (`pos=t`) and verify their resolved pages from `main.aux`.
  reason_summary:
  - Top placement is native to the CAS float system.
  - It avoids page-count inflation from exact-here placement.
  - The resolved output places Figure 2 on page 5 and Figure 3 on page 6.
  action: Change the Geomagic Touch figure from permissive placement to explicit top placement, rebuild the manuscript, and inspect the rendered page sequence.
  expected_result: Figure 2 appears near Section 4.1, Figure 3 appears near Section 5.1, and the PDF remains within nine pages.
  reversal_plan: If later content changes cause a figure to move away from its section, re-evaluate the surrounding page break or use a controlled section barrier without altering figure content.
  observation: The forced build produced a nine-page PDF; Figure 2 resolves to page 5 and Figure 3 resolves to page 6.
  actual_result: Both figures are adjacent to their referenced manuscript sections and no figure is deferred to the reference appendix or end of the manuscript.
  outcome_status: successful
  lesson: In this CAS double-column layout, explicit top placement is sufficient to keep the two small equipment/controller figures near their sections without forcing extra pages.
  evidence:
  - EV-034
  supersedes: []
