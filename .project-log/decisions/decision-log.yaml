- id: DEC-017
  title: Use a local RAS-style numbered bibliography style
  category: technical
  status: active
  authority: B
  user_approval: not-required
  related_tasks:
  - TASK-038
  related_business_logic: []
  context: The first citation-order fix used unsrtnat, which corrected the numbering order but did not reproduce the target RAS/Elsevier numbered bibliography presentation shown in the reference examples.
  hypothesis: A minimal local derivation of the official Elsevier numbered BibTeX style can preserve first-citation numbering while matching the RAS-style author, journal, volume, issue, year, and page layout.
  options:
  - name: Keep unsrtnat
    benefits:
    - Uses a standard distributed BibTeX style.
    - Preserves first-citation order.
    costs:
    - Bibliography punctuation and author formatting do not match the target RAS examples.
    risks:
    - A visually inconsistent reference list remains at submission.
  - name: Use a local ras-num style derived from elsarticle-num
    benefits:
    - Preserves first-citation numbering.
    - Matches the target numbered Elsevier/RAS presentation.
    - Allows DOI output to be suppressed without editing every BibTeX entry.
    costs:
    - The derived style must be included in the Overleaf or submission package.
    risks:
    - Future bibliography requirements may require revalidating the local style.
  - name: Manually reorder references
    benefits:
    - Avoids changing the bibliography style.
    costs:
    - Is brittle whenever citations move.
    risks:
    - Citation order can drift silently during later revisions.
  decision: Use local `ras-num.bst`, derived from the official Elsevier numbered style, for the manuscript bibliography.
  reason_summary:
  - RAS requires numbered square-bracket citations in order of first appearance.
  - The target examples use an Elsevier/RAS numbered visual format that unsrtnat does not reproduce.
  - The derived style keeps the existing citation keys and BibTeX workflow intact.
  - DOI output is disabled to match the supplied RAS reference examples.
  action: Set `\bibliographystyle{ras-num}`, normalize journal abbreviations in `references.bib`, rebuild, compare the first-citation order with the bibliography, scan warnings, inspect the rendered references, and synchronize both PDF output paths.
  expected_result: The manuscript uses first-citation numbered references with the RAS-style presentation, no DOI/URL output, and an unchanged nine-page layout.
  reversal_plan: Restore unsrtnat if the target journal later rejects the local style; update the style only through the documented template and rebuild.
  observation: The forced build exits 0 with a nine-page PDF; the strict warning scan is empty; all 25 first-citation keys exactly match the 25 bibliography items in order; the bibliography contains no DOI or URL output; and the two output PDFs have the same SHA256.
  actual_result: The bibliography now follows the target RAS numbered presentation while preserving the existing citation keys and manuscript layout.
  outcome_status: successful
  lesson: For a numbered journal, validate both the citation-order behavior and the rendered bibliography style; a standard unsorted style may solve only the ordering requirement.
  evidence:
  - EV-069
  supersedes:
  - DEC-015
  created_at: '2026-09-19T12:40:00Z'
  updated_at: '2026-09-19T12:40:00Z'
