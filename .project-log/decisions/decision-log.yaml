  related_business_logic: []
  context: 用户要求将软体平台 Figure 4 的圆形轨迹替换为螺旋轨迹，并在同一图中加入每个时刻的实际跟踪误差，以便同时观察轨迹形状和控制误差的时间演化。
  hypothesis: 使用上排螺旋/五角星轨迹、下排逐时刻二维欧氏误差的 2x2 紧凑布局，可以在不显著增加图幅的情况下同时展示轨迹跟踪能力和误差时间序列。
  options:
