- id: DEC-013
  title: Block soft-platform redraw until PID dataset identity is corrected
  category: process
  status: superseded
  authority: B
  user_approval: not-required
  related_tasks:
  - TASK-033
  related_business_logic: []
  context: The new figure-eight and five-point-star trajectories are complete and aligned, but the purported PID files contain Koopman-LQR metadata or configuration.
  hypothesis: Requiring corrected PID exports prevents mislabeling a different controller as the paper's baseline and avoids invalidating the control comparison.
  options:
  - name: Block redraw pending corrected PID exports
    benefits:
    - Preserves the scientific meaning of the FS-EDMD-LQR versus PID comparison.
    - Keeps the data audit traceable.
    costs:
    - Delays figure and table regeneration.
    risks:
    - User may need to rerun or re-export two experiments.
  - name: Treat current files as PID based on filenames
    benefits:
    - Allows immediate redraw.
    costs:
    - Contradicts the embedded controller configuration.
    risks:
    - The paper would report an incorrect baseline.
  decision: Use the two FS datasets, but do not redraw the soft-platform control figure or update the control table until corrected PID data is supplied or the controller identity is explicitly confirmed.
  reason_summary:
  - Filenames are not sufficient evidence when embedded controller metadata says Koopman-LQR.
  - The controller baseline identity is a critical scientific claim.
  action: Open Q-020, create TASK-033, and request corrected PID exports with controller configuration.
  expected_result: Two valid PID datasets with matching trajectory grids and PID configuration metadata will unblock the redraw.
  reversal_plan: If the current runs are confirmed to be PID and the metadata is known to be a generic exporter label, record that evidence and resume the redraw.
  observation: The data audit found 400 unique steps for the figure-eight runs and 500 for the five-point-star runs, with exact reference alignment in both pairs.
  actual_result: Trajectory volume is sufficient, but PID identity remains unresolved.
  outcome_status: partial
  lesson: Validate embedded controller metadata, not only filenames, before using experimental data as a paper baseline.
