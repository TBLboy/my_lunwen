- id: DEC-006
  title: 机械臂控制指标的统一评估窗口
  category: technical
  status: active
  authority: B
  user_approval: not-required
  related_tasks:
  - TASK-020
  - TASK-021
  related_business_logic: []
  context: 旧绘图与指标脚本对正弦、不规则和扰动数据使用了 3-33 s、8-38 s、5-35 s 等不同窗口，导致 Figure 3 与论文表格难以形成一致证据。
  hypothesis: 使用原始时间 10-40 s 可以覆盖完整的 30 秒轨迹任务以及主要扰动恢复事件，作为三个控制任务的统一评估窗口。
  options:
  - name: 统一使用 10-40 s
    benefits:
    - 与控制器初始化后开始轨迹任务的实验描述一致
    - 三个任务使用相同时间长度
    - 覆盖扰动数据中的主要恢复事件
    costs:
    - 需要重算论文现有 Table II 数值
    risks:
    - 与旧稿件中的历史数值不同，必须同步更新正文和表格
  - name: 沿用各自旧窗口
    benefits:
    - 不需要改动旧图和旧表
    costs:
    - 不同任务指标不可直接比较
    risks:
    - 审稿人可能质疑评估口径不一致
  - name: 使用完整 0-50 s
    benefits:
    - 保留全部数据
    costs:
    - 包含启动瞬态和任务结束后的无关数据
    risks:
    - 指标不能代表实际轨迹跟踪性能
  decision: 冻结原始时间 10-40 s 为机械臂控制统一评估窗口；图中平移为 0-30 s，Table II 使用该窗口复算的 RMSE 和 MAE。
  reason_summary:
  - 参考轨迹任务段位于初始化之后，10-40 s 提供完整的 30 秒跟踪区间。
  - 扰动数据的主要恢复事件均落在该窗口内。
  - 统一窗口消除旧稿中新旧指标不可追溯的问题。
  action: 使用 TASK-020 重新计算指标并生成 Figure 3；后续 Table II 和正文不再引用旧窗口指标。
  expected_result: Figure 3 与 Table II 使用同一可复现口径，机械臂控制结果内部一致。
  reversal_plan: 若实验记录证明控制器实际切换时间不是 10 s，则根据原始控制日志修订窗口并重新生成图与指标，同时将本决策标记为 superseded。
  observation: null
  actual_result: null
  outcome_status: not-observed
  lesson: null
  evidence:
  - EV-024
  supersedes: []
  created_at: '2026-09-15T11:15:00Z'
  updated_at: '2026-09-15T11:15:00Z'
- id: DEC-007
  title: 正式论文迁移到 RAS 的 Elsevier elsarticle 模板
  category: tooling
  status: superseded
  authority: C
  user_approval: approved
  related_tasks:
  - TASK-024
  related_business_logic: []
  context: 用户已确定后续投稿目标为 Robotics and Autonomous Systems（RAS），并指定 `论文部分/elsarticle` 作为正式论文写作模板。当前正文仍继承 RA-L 的 ieeeconf 前置结构和 IEEEtran 引用样式。
  hypothesis: 将正式稿立即迁移到 Elsevier 官方 `elsarticle` 类，可保留现有正文、公式、图表和编号引用，同时避免后续因摘要、关键词、作者信息和参考文献格式变化产生二次返工。
  options:
  - name: 继续使用 ieeeconf 后再迁移
    benefits:
    - 暂不需要调整 LaTeX 前置结构
    costs:
    - 图表宽度、摘要、关键词、作者信息和引用仍需再次适配
    risks:
    - 最终投稿前容易出现版式和引用返工
  - name: 立即迁移到 elsarticle preprint
    benefits:
    - 与 RAS/Elsevier 投稿要求一致
    - 保留现有编号引用
    - 后续内容修改直接在目标模板中进行
    costs:
    - 当前无 LaTeX 编译器，只能先做静态结构验证
    risks:
    - 尚未完成真实编译，局部样式问题可能在后续编译时暴露
  - name: 立即按最终 production-like 双栏版式迁移
    benefits:
    - 可以提前检查双栏图宽和页数
    costs:
    - 当前图 4 和设备图素材尚未齐备
    risks:
    - 过早排版会将尚未冻结的实验图作为版式约束
  decision: 正式稿统一使用 `论文部分/elsarticle/main.tex`，文档类固定为 `\documentclass[preprint,12pt]{elsarticle}`，引用样式使用 `elsarticle-num`；最终 production-like 双栏检查推迟到实验图和作者信息冻结后执行。
  reason_summary:
  - RAS 属于 Elsevier 期刊，官方 `elsarticle` 类可直接用于投稿稿。
  - 当前正文、公式、算法、定理、图表和编号引用可以原样保留，无需改写内容。
  - 先采用 preprint 格式可避免在 Figure 1/4 尚未完成时提前锁定最终双栏版式。
  action: 将 IEEE 专用前置结构替换为 Elsevier frontmatter，清除 IEEE 专用宏和 `cite` 包，改用 `keyword`、`\journal{Robotics and Autonomous Systems}` 与 `elsarticle-num`，并保留原 `old` 稿件。
  expected_result: 正式论文后续只在 `论文部分/elsarticle/main.tex` 维护；参考文献、图表路径和交叉引用在静态层面保持完整。
  reversal_plan: 若 RAS 作者指南要求作者—年份引用或特定 production 选项，则仅调整文档类和 citation/bibliography 配置，不改正文内容。
  observation: The later official RAS/Elsevier CAS template was confirmed by the user and became the active manuscript source.
  actual_result: The elsarticle preprint migration is retained as historical work but is no longer the active manuscript path.
  outcome_status: superseded
  lesson: When the journal's official template changes during revision, record the replacement decision explicitly and stop treating the earlier template as the active source.
  evidence:
  - EV-025
  supersedes: []
  created_at: '2026-09-16T03:27:40Z'
  updated_at: '2026-09-19T12:06:00Z'
- id: DEC-008
  title: 软体平台控制实验的初始接近段与标题评估窗口
  category: technical
  status: active
  authority: B
  user_approval: not-required
  related_tasks:
  - TASK-025
  related_business_logic: []
  context: 圆形和五角星控制数据均从实际光点静止位置开始，而参考轨迹从远离静止位置的形状起点开始。前约 30 个控制步主要由初始接近过程主导，若计入全段会掩盖控制器对轨迹形状的跟踪差异。
  hypothesis: 对两种控制器和两条轨迹统一从第 30 个控制步开始统计，可排除初始接近瞬态，并在相同任务阶段比较 FS-EDMD-LQR 与 PID。
  options:
  - name: 统计完整记录
    benefits:
    - 不需要定义评估起点
    costs:
    - 初始接近误差会主导 RMSE
    risks:
    - 难以反映圆形和五角星轨迹形状的跟踪质量
  - name: 统一从第 30 步开始
    benefits:
    - 排除初始接近瞬态
    - 两种控制器和两条轨迹使用完全相同的评估区间
    - 图 4 的轨迹形状与跟踪差异更清晰
    costs:
    - 正文需要明确说明统一评估起点
    risks:
    - 若后续设备实验改变初始条件，需要重新核对 30 步窗口
  - name: 每条轨迹分别选择不同起点
    benefits:
    - 可根据单条轨迹最快进入跟踪状态的时间裁剪
    costs:
    - 指标口径依赖人工选择
    risks:
    - 两个控制器难以进行公平比较
  decision: 圆形和五角星控制数据均按唯一 `step` 去重，并统一在 `step >= 30` 后计算 RMSE 和 MAE；图中参考轨迹显示完整形状，控制曲线只显示该共同评估区间。
  reason_summary:
  - 圆形和五角星在第 30 步左右均完成从静止位置到轨迹起点的过渡。
  - 统一窗口保留完整的形状跟踪阶段，避免由启动段决定主要指标。
  - FS-EDMD-LQR 与 PID 使用相同采样、起点和评估区间。
  action: 生成 `figure4_soft_control_tracking` 及指标 JSON，并在 Table II 中加入圆形和五角星两行结果。
  expected_result: Figure 4 清晰显示两种控制器的轨迹形状跟踪差异，Table II 与该图使用同一评估口径。
  reversal_plan: 若后续控制日志表明实际启动切换时间不同，则重新定义统一步数并重绘 Figure 4 与重算 Table II。
  observation: 圆形评估样本 970，五角星评估样本 470；两平台曲线在排除初始接近段后均进入稳定跟踪。
  actual_result: 圆形 FS-EDMD-LQR RMSE/MAE=0.054180/0.052832，PID=0.315988/0.303816；五角星 FS-EDMD-LQR=0.132083/0.127820，PID=0.631330/0.620165。
  outcome_status: successful
  lesson: 控制轨迹包含从静止位置到参考起点的迁移过程时，应在图文口径中明确区分初始接近和轨迹跟踪。
  evidence:
  - EV-026
  supersedes: []
  created_at: '2026-09-16T03:45:00Z'
  updated_at: '2026-09-16T03:45:00Z'
- id: DEC-009
  title: Figure 4 使用螺旋轨迹并增加逐时刻误差曲线
  category: process
  status: active
  authority: C
  user_approval: approved
  related_tasks:
