version: '0.2'
source_of_truth: true
atoms:
- id: BL-MODELING-001
  title: 建模代码自包含资源且源资源只复制不剪切
  kind: constraint
  domain: modeling
  status: active
  priority: critical
  risk: medium
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户确认：自包含，迁移数据和模型时复制而非剪切
  description: 建模代码目录必须包含运行所需的数据、模型和输出目录；创建时只能复制当前杂项资源，不能删除或移动源文件。
  actors:
  - 用户
  - Agent
  trigger: 搭建建模代码自包含工程
  preconditions:
  - 当前杂项中存在 data 和 models 资源
  - 建模代码目录为空或待重建
  inputs:
  - 杂项/data/*.mat
  - 杂项/models/*.pkl
  - 杂项/models/*.npz
  rule:
    statement: 建模代码运行所需的机械臂数据和模型文件从当前杂项复制到建模代码目录，原文件保持不变。
  outputs:
  - 建模代码/data/*.mat
  - 建模代码/models/*.pkl
  - 建模代码/models/*.npz
  side_effects:
  - 当前杂项源文件继续保留
  exceptions: []
  failure_handling:
  - 源文件缺失时中止迁移并报告缺失文件
  invariants:
  - 复制后文件与当前杂项源文件哈希一致
  acceptance:
  - id: AC-001
    given: 当前杂项 data/models 资源存在
    when: 完成资源迁移
    then: 建模代码目录包含对应文件，且杂项源文件仍存在
    method: 文件哈希比对和源文件存在性检查
    evidence: null
    status: not-verified
  dependencies: []
  baseline_refs: []
  decision_refs: []
  implementation_refs: []
  test_refs: []
  supersedes: []
  notes: null
- id: BL-MODELING-002
  title: 机械臂数据加载契约
  kind: data-contract
  domain: modeling
  status: active
  priority: critical
  risk: low
  authority: evidence-derived
  source:
    type: code
    reference: 杂项/utils.py
  description: 建模代码从本地 mat 文件加载机械臂处理版数据；训练、验证、测试数据和归一化参数必须符合现有脚本契约。
  actors:
  - Agent
  trigger: 运行建模代码的数据加载流程
  preconditions:
  - 建模代码/data 下存在 train_data.mat、val_data.mat、test_data.mat
  inputs:
  - 建模代码/data/train_data.mat
  - 建模代码/data/val_data.mat
  - 建模代码/data/test_data.mat
  rule:
    statement: 数据加载接口按现有 mat 结构读取状态、下一状态、控制输入和归一化参数，并支持训练、验证、测试三种数据。
  outputs:
  - X_train、Y_train、U_train
  - X_val、Y_val、U_val
  - X_test、U_test
  - q_scaler、q_dc、u_scaler、u_dc
  side_effects: []
  exceptions:
  - mat 文件缺失
  - mat 结构缺少必需字段
  failure_handling:
  - 抛出带具体文件路径和字段名的错误
  invariants:
  - 状态维度与现有脚本一致，测试数据可复现当前杂项验证结果
  acceptance:
  - id: AC-001
    given: 建模代码/data 包含处理版机械臂数据
    when: 调用数据加载接口
    then: 返回形状和字段与当前杂项脚本一致
    method: 运行数据加载并检查数组形状
    evidence: null
    status: not-verified
  dependencies:
  - BL-MODELING-001
  baseline_refs: []
  decision_refs: []
  implementation_refs: []
  test_refs: []
  supersedes: []
  notes: null
