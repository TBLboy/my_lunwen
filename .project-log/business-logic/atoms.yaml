- id: BL-SOFT-001
  title: 软体平台原始数据只读与处理输出
  kind: constraint
  priority: critical
  risk: medium
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户指定数据源：数据备份/软体平台/原始数据
  description: 新设备软体平台建模的数据源为 100 个 npz 原始轨迹；处理、训练和实验只能读取源数据或写入处理后的副本，不得移动、覆盖或删除源文件。
  actors:
  - 用户（论文作者）
  - Agent
  trigger: 开始软体平台数据处理或探索训练
  preconditions:
  - 数据备份/软体平台/原始数据 下存在 01.npz 至 100.npz
  inputs:
  - 数据备份/软体平台/原始数据/*.npz
  rule:
    statement: 处理、训练和评估只能读取原始 npz 或写入处理后的副本，不得移动、覆盖或删除源文件。
  outputs:
  - 处理后的训练/验证/测试数据副本
  - 实验记录
  side_effects:
  - 可能创建数据备份/软体平台/处理后的数据或实验输出目录
  exceptions:
  - 源文件缺失
  - 文件结构不符合 npz 契约
  failure_handling:
  - 缺失或损坏时中止并报告具体文件
  invariants:
  - 源文件数量与内容不被修改
  acceptance:
  - id: BL-SOFT-001-AC-001
    given: 源目录中存在 100 条 npz
    when: 完成数据处理或探索训练
    then: 源文件仍存在且处理产物不覆盖源文件
    method: 文件存在性与哈希/元数据检查
    evidence: null
    status: not-verified
  dependencies: []
  notes: null
  domain: soft-platform-modeling
  status: active
  baseline_refs: &id001
  - REQ-002
  decision_refs: &id002 []
  implementation_refs: &id003 []
