    type: user-statement
    reference: 用户要求探索产物输出到 杂项/软体平台探索实验结果，并按平均与最高精度筛选
  description: 探索训练完成后，按统一指标挑选论文展示配置；所有模型、配置、逐轨迹/平均指标写入指定实验目录。
  actors:
  - 用户（论文作者）
  - Agent
  trigger: 完成多组探索训练后汇总筛选
  preconditions:
  - 至少完成一组三个模型的训练与评估
  inputs:
  - 各组模型
  - 各组配置
  - 各组评估结果
  rule:
    statement: 筛选配置时，我们的模型/FS-EDMD 的最高精度（最小单轨迹 RMSE）必须最优，平均 RMSE 尽量低；EDMDDL 和 EDMD
      的次优顺序不强约束。
  outputs:
  - 最优配置推荐
  - 汇总指标表
  - 实验产物目录
  side_effects:
  - 写入 杂项/软体平台探索实验结果
  exceptions:
  - 无满足条件配置
  failure_handling:
  - 明确报告无入选配置及最接近候选
  invariants:
  - 每次探索的原始指标、配置和产物路径可追溯
  acceptance:
  - id: BL-SOFT-009-AC-001
    given: 多组训练评估完成
    when: 执行配置筛选
    then: 给出满足“我们的模型最高精度最优且平均 RMSE 尽量低”的最优配置与证据
