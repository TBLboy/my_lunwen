- id: BL-SOFT-002
  title: 固定 7:2:1 轨迹划分
  kind: rule
  priority: critical
  risk: medium
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户确认：数据集划分固定，后续探索不调整
  description: 100 条原始轨迹按 7:2:1 固定划分为 70 条训练、20 条验证、10 条测试。划分只执行一次并冻结，探索阶段不得调整。
  actors:
  - 用户（论文作者）
  - Agent
  trigger: 准备软体平台训练、验证和测试数据
  preconditions:
  - 100 条原始轨迹已读取
  - 确定性划分规则和种子已记录
  inputs:
  - 100 条原始轨迹索引
  rule:
    statement: 模型探索和训练统一使用同一份 70/20/10 轨迹划分；测试集固定为 10 条轨迹，不得用于训练或配置调优。
  outputs:
  - train/val/test 轨迹清单
  - 划分种子与生成时间记录
  side_effects: []
  exceptions:
  - 轨迹数量不足 100
  - 同一轨迹被分到多个集合
  failure_handling:
  - 数量或互斥校验失败时中止并报告
  invariants:
  - 训练 70 条、验证 20 条、测试 10 条
  - 所有集合互斥且并集为 100 条
  acceptance:
  - id: BL-SOFT-002-AC-001
    given: 原始数据共 100 条轨迹
    when: 执行固定划分
    then: 生成 70/20/10 且测试集为 10 条轨迹
    method: 自动检查集合计数和互斥性
    evidence: null
    status: not-verified
  dependencies:
  - BL-SOFT-001
  notes: null
  domain: soft-platform-modeling
  status: active
  baseline_refs: *id001
  decision_refs: *id002
  implementation_refs: *id003
  test_refs: *id004
  supersedes: *id005
  created_at: '2026-09-11T19:25:00Z'
  updated_at: '2026-09-11T19:25:00Z'
  last_verified_at: null
- id: BL-SOFT-003
  title: 软体平台样本数据契约
  kind: data-contract
  priority: critical
  risk: low
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户说明状态 x 为 2D xy、控制 u 为 2D，输入输出关系按一步预测建模
  description: 将每条原始轨迹处理为一组一步预测样本；状态和控制均为 Float64 二维数组，保留轨迹和时间索引映射。
  actors:
  - Agent
  trigger: 构建软体平台训练数据
  preconditions:
  - 固定划分已完成
  - 每条 npz 包含 t、x、u 字段
  inputs:
  - 'x: (N,2)'
  - 'u: (N,2)'
  - 't: (N,)'
  rule:
    statement: 对每条轨迹构造 X=x[t]、U=u[t]、Y=x[t+1]，数据类型为 Float64，并保留轨迹 id 与 t 索引映射。
  outputs:
  - X_train/Y_train/U_train
  - X_val/Y_val/U_val
  - X_test/Y_test/U_test
  - 轨迹/时间索引映射
  side_effects: []
  exceptions:
  - 字段缺失
  - 维度不匹配
  - 出现 NaN/Inf
  failure_handling:
  - 报错并输出具体 npz 文件与字段
  invariants:
  - 所有输入输出为 Float64
  - 样本不跨越轨迹
  - 测试轨迹不混入训练
  acceptance:
  - id: BL-SOFT-003-AC-001
    given: 完成数据处理
    when: 检查样本形状和数值
    then: X/U 为 (样本数,2)、Y 为 (样本数,2) 且无 NaN/Inf
    method: 运行数据检查脚本
    evidence: null
    status: not-verified
  dependencies:
  - BL-SOFT-002
  notes: null
  domain: soft-platform-modeling
  status: active
  baseline_refs: *id001
  decision_refs: *id002
  implementation_refs: *id003
  test_refs: *id004
