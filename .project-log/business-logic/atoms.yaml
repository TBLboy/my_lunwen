- id: BL-SOFT-004
  title: 软体平台升维函数库需求
  kind: constraint
  priority: critical
  risk: medium
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户要求升维函数库包含常数、xy 分量，目标约 200 维
  description: 为软体平台系统建立可配置升维函数库，默认目标维度约 200；必须包含常数项和 x/y 状态分量，其他候选基函数由探索决定。
  actors:
  - Agent
  trigger: 训练 FS-EDMD、EDMD、EDMDDL 前选择特征
  preconditions:
  - 样本数据契约已满足
  inputs:
  - 'x: (N,2)'
