- id: BL-SOFT-008
  title: 10 条测试轨迹评估契约
  kind: rule
  priority: critical
  risk: medium
  authority: user-confirmed
  source:
    type: user-statement
    reference: 用户确认每训练一组在 10 条测试轨迹上测试，并采用 RMSE
  description: 每组训练配置都在同一 10 条固定测试轨迹上评估，逐条计算反归一化后的 xy 位置预测 RMSE，并汇总平均与最高精度。
  actors:
  - Agent
  trigger: 完成一组训练后运行正式评估
  preconditions:
  - 固定测试集 10 条轨迹
  - 模型可加载
  - 反归一化参数可用
  inputs:
  - X_test/Y_test/U_test
  - 模型
  - 归一化参数
  rule:
    statement: 评估指标为每条测试轨迹的 xy 位置预测 RMSE；平均精度为 10 条轨迹 RMSE 的均值，最高精度为 10 条轨迹中 RMSE
      最小的一条。
  outputs:
  - 逐轨迹 RMSE
  - 平均 RMSE
  - 最高精度（最小单轨迹 RMSE）
  side_effects: []
  exceptions:
  - 测试集不足 10 条
  - 预测形状不匹配
  failure_handling:
  - 指标无法计算时报告具体轨迹和原因
  invariants:
  - 所有模型使用同一 10 条测试轨迹和同一指标定义
  acceptance:
  - id: BL-SOFT-008-AC-001
    given: 模型与固定测试集可用
    when: 运行评估
    then: 输出 10 条轨迹各自的 xy RMSE、平均 RMSE 和 RMSE 最小轨迹
    method: 校验指标表字段和数量
    evidence: null
    status: not-verified
  dependencies:
  - BL-SOFT-002
  - BL-SOFT-003
  notes: null
  domain: soft-platform-modeling
  status: active
  baseline_refs: *id001
  decision_refs: *id002
  implementation_refs: *id003
