  context: 论文当前贡献为 FS-EDMD 特征选择、BCD 联合优化和鲁棒 Koopman-LQR。用户计划加入软体平台建模与控制实验，目标控制在 8 页以内；需要确认软体平台是作为跨平台验证，还是上升为新的第一贡献。
