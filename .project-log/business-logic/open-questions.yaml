  context: 软体平台已有固定 10 条测试轨迹。轨迹 66 上 FS-EDMD 最优，但当前汇总显示 FS-EDMD 平均 RMSE 暂未全面优于 EDMDDL；审稿意见又要求解释数据依赖和泛化能力。
  recommendation: 论文以固定 10 条测试轨迹的平均 RMSE 作为主指标，轨迹 66 仅作为代表性定性展示；若 FS-EDMD 平均指标不占优，则必须继续优化模型或把论文主张改为精度-复杂度折中。
