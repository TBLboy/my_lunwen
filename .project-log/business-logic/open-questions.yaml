    description: 延续当前单轨迹展示，图更简洁，但容易被审稿人质疑挑选测试样本，和泛化性意见冲突。
  - name: 平均与单轨迹并列
    description: 同时报告平均和代表性轨迹，信息完整但需要严格控制图表篇幅。
