- id: Q-019
  title: RAS physical page limit versus the internal eight-page target
  status: answered
  authority: C
  impact: high
  uncertainty: high
  rework_cost: medium
  related_business_logic: []
  related_tasks:
  - TASK-029
  - TASK-030
  context: The official RAS Guide for Authors supplied by the user does not state an eight-page limit. The current CAS PDF has eight numbered article pages followed by deferred full-width float pages, and the project previously treated eight physical pages as a hard constraint.
  recommendation: Use nine physical pages or fewer as the internal target, with later iterative adjustments to figure layout and experimental formatting. Keep the experiment-section physical footprint no larger than that of the old manuscript even though the soft-platform content is added.
  alternatives:
  - name: Keep nine physical pages
    description: Set nine pages as the internal upper target and tune figures and experiment layout without enlarging the experiment footprint.
  - name: Keep eight physical pages
    description: Preserve the original internal constraint and continue compressing figures, text, and tables.
  - name: Remove the page target
    description: Focus only on compliance and scientific clarity, accepting a longer double-column manuscript.
  answer: "RAS has no hard eight-page limit. Use nine pages or fewer as the internal target. The experiment section may gain scientific content, such as the soft-platform validation, but its physical footprint must not increase relative to the old manuscript. Figure redraws and experiment-section reflow may be adjusted repeatedly to approach the nine-page target."
