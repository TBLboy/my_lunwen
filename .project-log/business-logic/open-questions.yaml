- id: Q-010
  title: 是否新增 Jacobian/局部线性化 LQR 对照实验
  status: answered
  authority: C
  impact: critical
  uncertainty: high
  rework_cost: high
  related_business_logic: []
  related_tasks: []
  context: RA-L 明确质疑 FS-EDMD + LQR 相比 Jacobian linearization + LQR 的优势。现有控制实验只有 Koopman-LQR 与 PID；机械臂工程中存在动力学模型与训练数据，软体平台只有数据驱动模型。
  recommendation: 新增一个局部线性化/LQR 基线，优先在相同机械臂训练数据上拟合 `x_{k+1}=A x_k+B u_k` 后设计 LQR，并作为传统线性化路线的数据驱动近似；若时间允许，再在软体平台补充同名基线。只在正文说明优势、不新增对照，复审风险较高。
  alternatives:
  - name: 精确 Jacobian 基线
    description: 对机械臂物理模型在平衡点求 Jacobian 并设计 LQR，更贴合审稿意见，但复现和平台对齐成本更高，软体平台难以做到。
  - name: 不新增基线
    description: 只收窄论文主张，强调模型只适用于给定数据域和任务域，不做优于 Jacobian 的声明。
  answer: 用户决定不新增 Jacobian/局部线性化 LQR 对照。理由：机械臂当前故障，重新实验成本高；Koopman 属于全局线性化路线，与局部 Jacobian 线性化的直接比较意义有限；本次目标改为三区期刊，控制部分维持 FS-EDMD-LQR 与 PID 对比。论文应避免宣称相对局部线性化具有普遍优势。
  source_refs:
  - 论文部分/不同期刊编辑意见汇总.md
  - 控制实验部分代码/机械臂/Koopman_Data_Generator/robot2.m
  - 建模代码/models
  created_at: '2026-09-15T08:55:00Z'
  answered_at: '2026-09-15T09:05:00Z'
- id: Q-011
  title: 软体平台控制实验矩阵
  status: superseded
  authority: C
  impact: high
  uncertainty: high
  rework_cost: high
  related_business_logic: []
  related_tasks: []
  context: 用户计划采集软体平台控制器轨迹跟踪数据，使用 FS-EDMD-LQR 与 PID 对比。需要一个固定实验矩阵来决定采集数据、图表数量和 8 页预算。
  recommendation: 采用 3 条代表性轨迹：圆形、五角星、非规则轨迹；两种控制器使用相同起点、采样周期、限幅和终点条件；记录参考 xy、实测 xy、控制量、时间；主图展示 xy 轨迹，指标表报告 RMSE/MAE/最大误差。
  alternatives:
  - name: 2 条轨迹
    description: 圆形和五角星，图表更省空间，但控制多样性和说服力弱于 3 条。
  - name: 4 条以上轨迹
    description: 证据更充分，但数据采集和 8 页排版压力最高，适合压成矩阵式小图。
  answer: 用户确认只采集两条轨迹：圆形和五角星；论文中合并为一张左右双子图，共用图例，以节约 8 页篇幅。控制器比较保持 FS-EDMD-LQR 与 PID。默认报告 RMSE、MAE 和最大误差，两控制器使用相同起点、采样周期、控制限幅和终点条件。
  source_refs:
