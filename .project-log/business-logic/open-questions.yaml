  context: 用户希望重构并迁移三类建模代码，但尚需确认交付范围是仅整理迁移代码，还是覆盖训练、评估、绘图完整可运行闭环。
  recommendation: 覆盖训练到评估到绘图的完整闭环，因为当前杂项已具备这一链路且已跑通，验证成本最低。
