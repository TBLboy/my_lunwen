- id: Q-005
  title: 软体平台 7:2:1 数据划分是否固定一次并锁定
  status: answered
  authority: C
  impact: high
  uncertainty: low
  rework_cost: high
  related_business_logic:
  - BL-SOFT-002
  related_tasks: []
  context: 原始数据为 100 条轨迹，每条 300 步；业务要求按 7:2:1 生成 70 条训练、20 条验证、10 条测试。若每轮探索都重新抽样，测试集可能被无意中用于调参，导致论文结果不可复现。
  recommendation: 固定一次带随机种子的确定性划分并保存划分清单；后续所有探索只使用同一训练/验证集，10 条测试轨迹仅在最终评估阶段使用。
  alternatives:
  - name: 每次探索重新划分
    description: 实现简单，但结果不公平且不可复现。
  - name: 按文件名顺序划分
    description: 确定但可能引入顺序偏差。
  answer: 固定一次：采用确定性轨迹划分 70/20/10；后续探索只调整训练参数配置和升维函数库，不调整数据集划分。
  source_refs:
  - 数据备份/软体平台/原始数据
  created_at: '2026-09-11T11:05:00Z'
  answered_at: '2026-09-11T19:25:00Z'
- id: Q-006
  title: 每条轨迹的精度指标定义
  status: answered
  authority: C
  impact: critical
  uncertainty: low
  rework_cost: critical
  related_business_logic: []
  related_tasks: []
  context: 筛选训练配置需要统一精度口径；用户确认采用 RMSE。
  recommendation: 每条轨迹计算去归一化后 xy 位置预测 RMSE；平均精度为 10 条轨迹 RMSE 均值；最高精度为 RMSE 最小的单条轨迹。
  alternatives: []
  answer: RMSE
  source_refs: []
  created_at: '2026-09-11T11:04:00Z'
  answered_at: '2026-09-11T11:04:00Z'
