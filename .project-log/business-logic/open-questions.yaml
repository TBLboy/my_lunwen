- id: Q-004
  title: 建模代码目录中的数据、模型和输出组织方式
  status: answered
  authority: C
  impact: high
  uncertainty: medium
  rework_cost: medium
  related_business_logic: []
  related_tasks: []
  context: 完整闭环需要机械臂数据、模型文件和输出目录；需要确认这些资源是复制进建模代码目录形成自包含项目，还是通过配置引用现有备份目录。
  recommendation: 将当前杂项中已验证的数据、模型和输出资源纳入建模代码目录，形成可独立复现的工程；原始备份仍保留在数据备份中。
  alternatives:
  - name: 仅代码目录
    description: 建模代码只包含代码和配置，运行时通过路径读取外部数据/模型
  - name: 只复制必要资源
    description: 复制训练、测试数据的处理版和三个模型，输出统一放结果目录
  answer: 建模代码采用自包含工程，数据和模型文件从当前杂项复制到建模代码目录，复制而非剪切。
