version: '0.2'
baselines:
- id: REQ-001
  revision: 1
  status: active
  goal: 在当前论文材料工程中建立自包含的建模代码目录，从当前杂项复制机械臂数据和模型，重构迁移三类建模代码（我们的方法/FS-EDMD、EDMDDL、EDMD），交付数据加载、训练/加载模型、评估、绘图的完整闭环。
  actors:
  - 用户（论文作者）
  - Agent
  in_scope:
  - 在建模代码目录建立可复现的工程结构
  - 从当前杂项复制机械臂数据和三个模型，复制而非剪切
  - 重构迁移我们的方法/FS-EDMD、EDMDDL、EDMD 三类训练代码
  - 提供数据加载、训练/加载模型、评估、绘图的完整闭环
  - 生成三方法对比指标表和位置/速度对比图
  - 记录运行环境和复现命令
  out_of_scope:
  - NN 训练基线 train_nn.py
  - 原论文3中跑出发散结果的绘图脚本
  - 控制实验部分代码
  - 软体平台数据和结果备份
  - MATLAB/Simulink 控制数据生成流程
  - 修改论文 LaTeX 或正文
  business_logic_refs:
  - BL-MODELING-001
  - BL-MODELING-002
  - BL-MODELING-003
  - BL-MODELING-004
  - BL-MODELING-005
  - BL-MODELING-006
  - BL-MODELING-007
  - BL-MODELING-008
  constraints:
  - 迁移数据和模型文件时必须复制，不得剪切或删除当前杂项源文件。
  - 建模代码目录必须自包含，正常运行不得依赖论文3或杂项路径。
  - 以当前杂项已跑通的绘图脚本和机械臂数据为基线。
  - 使用随工程提供的模型评估时，指标不得发散，应与当前杂项基线一致。
  - 训练与评估保持 float64 精度约定和现有模型矩阵格式。
  quality_attributes:
  - 可复现：统一命令可完成训练/加载、评估和绘图。
  - 可验证：输出文件非空，格式、哈希和指标可自动检查。
  - 可维护：代码、数据、模型和输出目录职责清晰。
  - 可追踪：迁移来源、基线版本和验证证据写入 .project-log。
  assumptions:
  - 用户所提“我们的模型”对应当前代码中的 OursKoopmanTrainer/FS-EDMD；若后续更名，由用户确认后更新。失效触发：用户指定不同算法。
  - 处理版机械臂 train/val/test mat 数据为本次建模闭环数据源。失效触发：用户改用另一数据集。
  - 当前杂项 figures/metrics_table.txt 为基线指标。失效触发：用户重新确认基线结果。
  unresolved_questions: []
  approval:
    status: approved
    evidence:
    - 用户确认以当前杂项绘图脚本和机械臂数据为基线
    - 用户确认交付完整闭环
    - 用户确认采用自包含工程，数据和模型复制而非剪切
  supersedes: []
  created_at: '2026-09-10T09:20:00Z'
  updated_at: '2026-09-10T09:20:00Z'
- id: REQ-002
  revision: 1
  status: active
  goal: 基于新设备软体平台 100 条原始轨迹，固定 7:2:1 划分为 70/20/10，建立约 200 维可配置升维函数库，探索训练 FS-EDMD、EDMD、EDMDDL；在固定
    10 条测试轨迹上按 xy 位置 RMSE 筛选配置，探索产物输出到杂项/软体平台探索实验结果。
  actors:
  - 用户（论文作者）
  - Agent
  in_scope:
  - 读取数据备份/软体平台/原始数据下的 01.npz 至 100.npz
  - 固定 7:2:1 轨迹划分（70 训练/20 验证/10 测试）并冻结
  - 将原始轨迹处理为 X=x[t]、U=u[t]、Y=x[t+1] 的 Float64 样本
  - 新建约 200 维可配置升维函数库，包含常数项和 x/y 状态分量
  - 探索 FS-EDMD、EDMD、EDMDDL 的配置并训练三类模型
  - 在固定 10 条测试轨迹上逐条评估，输出平均 RMSE 和最高精度
  - 按“我们的模型最高精度最优、平均 RMSE 尽量低”筛选展示配置
  - 将探索产物输出到杂项/软体平台探索实验结果
  - 软体平台代码放入建模代码根目录，不新建 soft_platform 等软体平台专属子文件夹
  - 数据准备、训练、评估过程中产生的模型、中间数据、指标和图表写入杂项/软体平台探索实验结果
  out_of_scope:
  - 修改、移动或删除原始数据源
  - 探索或调整数据集划分、测试轨迹集合
  - 修改已完成的机械臂建模代码和其基线资源
  - 论文 LaTeX 或正文写作
  - 控制实验部分代码
  - 在建模代码下新建 soft_platform 等软体平台专属子文件夹
  business_logic_refs:
  - BL-SOFT-001
  - BL-SOFT-002
  - BL-SOFT-003
  - BL-SOFT-004
  - BL-SOFT-005
  - BL-SOFT-006
  - BL-SOFT-007
  - BL-SOFT-008
  - BL-SOFT-009
  - BL-SOFT-010
  constraints:
  - 数据划分固定，探索阶段不得调整；10 条测试轨迹不得用于训练或配置调优。
  - 升维函数库默认目标约 200 维，必须包含常数项和 x/y 分量，具体函数集合和维度可探索。
  - 每组训练配置必须在同一 10 条测试轨迹上评估。
  - 精度指标为反归一化后的 xy 位置预测 RMSE；逐条、平均和最高精度均需输出。
  - 原始数据采取只读/复制方式使用，不得剪切或覆盖。
  - 探索产物写入杂项/软体平台探索实验结果。
  - 训练与评估保持 Float64 精度约定。
  - 软体平台建模代码不新建专属子文件夹，直接并入建模代码根目录。
  - 除必要的源数据处理副本外，训练/评估中间产物写入杂项/软体平台探索实验结果。
  quality_attributes:
  - 可复现：固定划分、种子和每组配置均记录。
  - 可比较：所有模型共用同一测试集和同一指标口径。
  - 可追溯：每次探索记录配置、模型、逐轨迹/平均指标和产物路径。
  - 可扩展：升维函数库和训练参数配置可按后续需求调整。
  assumptions:
  - 划分以 100 条轨迹为整体，测试集固定为 10 条轨迹。
  - 确定性划分种子在实现时固定并记录，不作为探索参数。
  - 样本以整条轨迹为单位划分，不跨越集合。
  - 归一化参数只能从训练数据拟合；验证只用于配置/早停选择，测试用于最终评估。
  - “我们的模型”对应当前工程中的 FS-EDMD/OursKoopmanTrainer；若后续更名，由用户确认后更新。
  unresolved_questions: []
  approval:
    status: approved
    evidence:
    - 用户确认数据集划分固定，后续只探索训练参数和升维函数库
    - 用户确认精度指标采用 RMSE
  supersedes: []
  created_at: '2026-09-11T19:25:00Z'
  updated_at: '2026-09-11T19:40:00Z'
