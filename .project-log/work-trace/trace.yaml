version: "0.2"
entries:
- id: WT-031-001
  task_id: TASK-031
  context: Figure 2 and Figure 3 were reported at the end of the CAS manuscript instead of near their corresponding sections.
  hypothesis: The permissive float placement allowed the CAS double-column float queue to defer the controller and equipment figures.
  decision_ref: DEC-011
  action: Set both figures to explicit top placement in manuscript_body.tex, force a complete LaTeX/BibTeX rebuild, and inspect the resolved labels, pages, and rendered sequence.
  expected_result: Figure 2 remains near Section 4.1, Figure 3 remains near Section 5.1, and the manuscript stays within nine pages.
  observation: The rebuilt PDF has nine pages; Figure 2 resolves to page 5 and Figure 3 to page 6; no undefined references, fatal errors, or missing figure files were found.
  actual_result: The placement repair passed the page, reference, and visual checks.
  delta: Changed Figure 3 from `pos=htbp` to `pos=t`; Figure 2 already used `pos=t`.
  lesson: For these compact CAS figures, explicit top placement is sufficient and avoids extra pages from exact-here float forcing.
  next_adjustment: Preserve the current explicit placement unless later text changes alter the page break.
  evidence:
  - EV-034
  knowledge_candidate: false
- id: WT-034-001
  task_id: TASK-034
  context: The paper had three rejections whose feedback mixed journal-scope mismatch with genuine issues in novelty framing, justification, experiment coverage, and technical validation.
  hypothesis: Treating every reviewer comment as a manuscript defect would over-expand the paper and dilute its main contribution; the comments first need classification by consequence and revision action.
  decision_ref: null
  action: Separate journal-fit feedback from content, experimental, data, and formatting feedback; keep scope-based recommendations for journal selection, and convert only evidence-backed criticisms into manuscript work.
  expected_result: The revision stays centered on FS-EDMD plus robust Koopman-LQR while still addressing the substantive objections.
  observation: The resulting plan retained the core method, narrowed unsupported claims, added cross-platform evidence, and did not introduce an unrelated local-linearization baseline.
  actual_result: The revision strategy remained coherent and the three journal rejections produced distinct actions rather than one undifferentiated expansion request.
  delta: Replaced blanket adoption with a triage table and per-comment disposition.
  lesson: An academic-revision Skill should classify review comments before editing and distinguish journal fit from scientific defects.
  next_adjustment: Encode this triage as an explicit early-stage gate in the future Skill.
  evidence: []
  knowledge_candidate: true
- id: WT-034-002
  task_id: TASK-034
  context: The original experiment used one three-degree-of-freedom arm, and the reviewers considered the validation too narrow and ideal. The user required added soft-platform evidence without increasing the experiment section's physical footprint.
  hypothesis: A second platform with different dynamics can strengthen external validity if the new evidence is framed as cross-platform validation and the paper's main contribution remains unchanged.
  decision_ref: DEC-010
  action: Add soft-platform modeling and control evidence, use a rigid arm and cable-driven platform as complementary systems, compact the supporting figures, and keep the manuscript within the user-approved nine-page internal target.
  expected_result: The paper covers more experimental conditions without turning the soft platform into a second paper or exceeding the page budget.
  observation: The final structure uses two modeling figures, two control figures, one combined metrics table, and cross-platform language in the abstract, introduction, and roadmap.
  actual_result: The added experiments improve coverage while the manuscript remains nine pages and the experiment-related claims remain tied to explicit comparisons.
  delta: Experiment count and platform diversity increased without an equivalent increase in experimental-section length.
  lesson: Experimental expansion should be driven by an identified claim gap and shipped with an explicit figure and page budget.
  next_adjustment: A paper-revision Skill should require a claim-to-experiment-to-figure map before adding new experiments.
  evidence:
  - EV-051
  knowledge_candidate: true
- id: WT-034-003
  task_id: TASK-034
  context: New soft-platform control exports had misleading controller labels, unequal sampling lengths, unstable timestamps, and repeated terminal rows.
  hypothesis: Plotting or evaluating the files by filename and raw time would produce a mislabeled baseline, overweight the endpoint, and misalign the controllers.
  decision_ref: DEC-013
  action: Verify controller identity with the user, deduplicate by step, ignore the unstable time axis, decimate the longer Lissajous trajectory, align controllers by sample index, and use a common evaluation window.
  expected_result: The figure and metrics use aligned, correctly identified controller runs and a reproducible evaluation window.
  observation: The processed data contain 500 aligned samples per task and controller; the revised figure and table were regenerated from that aligned data.
  actual_result: The figure integration passed data-row, metric, PDF, and rendered-image checks.
  delta: Replaced filename-based assumptions and raw-time pairing with explicit provenance confirmation and sample-index alignment.
  lesson: Paper revision must audit data semantics and controller identity, not only whether a figure script runs.
  next_adjustment: Include a data-provenance gate in any future paper-revision Skill before results are accepted.
  evidence:
  - EV-038
  - EV-045
  knowledge_candidate: true
- id: WT-034-004
  task_id: TASK-034
  context: After adding the soft-platform experiments, the Abstract and Introduction still contained a single-platform roadmap and implied that disturbance robustness had been tested on both platforms.
  hypothesis: Experiment additions create stale claims at the most visible narrative boundaries even when the experiment section itself is correct.
  decision_ref: null
  action: Audit the Abstract, contributions, and roadmap against the actual experiment matrix; limit robustness to the arm test; add dual-platform validation to the contributions; and recompile and inspect pages 1-2.
  expected_result: The narrative matches the available evidence and no longer overstates cross-platform robustness.
  observation: The revised Abstract is 209 words, the clean-copy build is nine pages, the strict warning scan is clean, and pages 1-2 render correctly.
  actual_result: The Abstract and Introduction now agree with the experiment scope and comparison structure.
  delta: Corrected one unsupported generalization and one stale platform-count statement.
  lesson: Every experiment change should trigger a consistency audit across Abstract, Introduction, Contributions, Roadmap, Results, and Conclusion.
  next_adjustment: Make cross-section claim consistency a mandatory final gate in the future Skill.
  evidence:
  - EV-051
  knowledge_candidate: true
- id: WT-035-001
  task_id: TASK-035
  context: The Conclusion merged prediction, tracking, and disturbance-robustness improvements across both experimental platforms, while disturbance recovery was tested only on the robotic arm and no operating-range limitation was stated.
  hypothesis: A conclusion that mirrors the experiment matrix and separates theory, platform evidence, and bounded applicability will reduce overclaiming without weakening the contribution.
  decision_ref: null
  action: Rewrite the Conclusion to distinguish the two-platform prediction and tracking results from the arm-only disturbance-recovery test, state the tested operating ranges and bounded-disturbance setting, and retain future work as a direct extension.
  expected_result: Every Conclusion claim is supported by the final experiments and the platform scope is unambiguous.
  observation: The clean-copy build succeeds with nine pages and no actionable warnings, and the rendered page containing the Conclusion shows a complete, well-formed paragraph.
  actual_result: The Conclusion now matches the Abstract and experiment matrix while preserving the theoretical bound and future-work statement.
  delta: Replaced one aggregated cross-platform robustness claim with separately scoped prediction, tracking, and disturbance-recovery statements.
  lesson: Manuscript conclusions should be generated from the final evidence matrix rather than by compressing the Abstract into a stronger closing sentence.
  next_adjustment: Use the Conclusion checklist in the future paper-revision Skill as a mandatory final consistency gate.
  evidence:
  - EV-053
  knowledge_candidate: true
- id: WT-036-001
  task_id: TASK-036
  context: The Abstract and Introduction used EDMD, EDMDDL, and FS-EDMD, including two non-obvious or project-specific abbreviations, while the user clarified that common field abbreviations such as LQR and ReLU should not be expanded mechanically.
  hypothesis: A terminology audit should distinguish established abbreviations from non-obvious or coined terms, and should check Abstract and main-text occurrences independently.
  decision_ref: null
  action: Define Extended Dynamic Mode Decomposition (EDMD), Extended Dynamic Mode Decomposition with Dictionary Learning (EDMDDL), and feature-selection-based EDMD (FS-EDMD) before their first short-form uses; leave LQR, PID, PCA, ReLU, MSE, RMSE, and MAE unchanged; then rebuild in a clean copy.
  expected_result: Readers can resolve every non-obvious acronym at first occurrence without making common robotics and control terminology unnecessarily verbose.
  observation: The source audit showed EDMD at the first relevant Abstract and Introduction positions, EDMDDL introduced before later baselines, and FS-EDMD introduced as the proposed method; the clean-copy build exits 0 with nine pages and no strict-warning matches, and pages 1-2 render correctly.
  actual_result: The manuscript now follows a layered abbreviation policy rather than a blanket expansion rule.
  delta: Added first-use expansions for non-obvious acronyms and recorded the exception policy for established terms.
  lesson: "Terminology consistency checks should be sensitivity-based: define what a cross-disciplinary reader would not know, and avoid redundant expansions of standard field terms."
  next_adjustment: Reuse this layered rule in the future paper-revision Skill and apply it independently to the Abstract and main text.
  evidence:
  - EV-054
  knowledge_candidate: true
- id: WT-036-002
  task_id: TASK-036
  context: The first abbreviation pass checked the Abstract and Introduction independently, so EDMD, EDMDDL, and FS-EDMD were expanded again in the Introduction even though the Abstract had already introduced them.
  hypothesis: For this manuscript's style, the Abstract and main text should be audited as one ordered document rather than as two independent definition scopes.
  decision_ref: null
  action: Replace the Introduction's repeated full terms with EDMD, EDMDDL, and FS-EDMD, and change the reusable rule so that a definition in the Abstract suppresses later full-term repetition in the main text.
  expected_result: Each non-obvious abbreviation is defined once at its first document occurrence and only the short form is used afterward.
  observation: Source search now finds the full terms in the Abstract, while the Introduction directly uses EDMD, EDMDDL, and FS-EDMD; the clean-copy build exits 0 with nine pages and a clean strict-warning scan, and pages 1-2 were visually inspected.
  actual_result: The duplicate Introduction definitions were removed without changing the technical claims or layout.
  delta: Corrected the interpretation from two separate first-use checks to one document-level first-use check.
  lesson: In this paper, the Abstract counts as the first occurrence for the main text; once an abbreviation is defined there, the Introduction should not repeat the full term.
  next_adjustment: Encode this document-level abbreviation order check in the future paper-revision Skill.
  evidence:
  - EV-055
  knowledge_candidate: true
- id: WT-037-001
  task_id: TASK-037
  context: The Introduction citations appeared out of order because `cas-model2-names.bst` performs author-title sorting rather than citation-order numbering.
  hypothesis: Replacing the bibliography style with natbib-compatible `unsrtnat` will number and list references by first citation while preserving the CAS layout.
  decision_ref: DEC-015
  action: Change the bibliography style, rebuild in a clean copy, compare the first-citation sequence from `main.aux` with the `main.bbl` bibliography order, and inspect the Introduction and bibliography pages.
  expected_result: The Introduction uses sequential citation numbers by first appearance, the bibliography follows the same order, and the manuscript remains nine pages without actionable warnings.
  observation: The clean build exits 0 with nine pages and no strict-warning matches; all 25 first-citation keys exactly match the bibliography order, and pages 1, 8, and 9 render correctly.
  actual_result: Citation numbering is now sequential by first occurrence, with only normal repeated references later in the manuscript.
  delta: Replaced an author-sorted bibliography style with an unsorted natbib style instead of manually reordering BibTeX entries.
  lesson: A bibliography style can look numerically formatted while still sorting by author; for numbered journals, validate the actual first-citation sequence against the generated bibliography.
  next_adjustment: Include an `.aux`-versus-`.bbl` citation-order check in the future paper-revision Skill.
  evidence:
  - EV-056
  knowledge_candidate: true
- id: WT-030-001
  task_id: TASK-030
  context: Figure 3 changed from an arm-only equipment photograph to a combined setup showing both the Geomagic Touch robot arm and the soft platform, while the caption, label, and Section 5.1 text still described an arm-only figure.
  hypothesis: A figure-content expansion must be treated as a semantic change, so its caption, cross-reference label, and adjacent platform descriptions all need to be updated together.
  decision_ref: null
  action: Replace the arm-only caption and label with a combined experimental-setup description, reference that figure from the opening of Section 5.1, and revise the soft-platform paragraph to match the component labels visible in the new figure.
  expected_result: Section 5.1 describes both experimental platforms from one consistent figure reference, the figure resolves to the correct page, and the manuscript remains nine pages.
  observation: The rebuilt PDF is nine pages, Figure 3 resolves to page 6, the strict warning scan is clean, and the rendered page shows the combined caption and dual-platform description without clipping or missing references.
  actual_result: The figure and Section 5.1 now use a single consistent dual-platform narrative while the original data-collection and split statements remain unchanged.
  delta: Updated the caption, renamed the figure label, added the combined figure reference, and expanded the soft-platform hardware description to match the figure labels.
  lesson: When an equipment figure gains another device or subsystem, the caption and every nearby hardware description must be audited as part of the same change.
  next_adjustment: Include a figure-asset-to-caption-and-prose consistency check in the future paper-revision Skill.
  evidence:
  - EV-060
  knowledge_candidate: true
- id: WT-030-002
  task_id: TASK-030
  context: The user replaced Figure 3 and reported that the compiled manuscript still showed the old image, even though Section 5.1 had been updated to describe the combined setup.
  hypothesis: The source figure and fresh build may be correct, while the user-visible PDF path may point to an older duplicate output.
  decision_ref: null
  action: Compare timestamps and SHA256 values for `els-cas/main.pdf`, `els-cas-templates/main.pdf`, and `pictures/Figure3.pdf`; then copy the latest build to the top-level user-facing PDF path and compare the results.
  expected_result: The top-level and template PDFs become byte-identical and both contain the new Figure 3.
  observation: The old top-level PDF was dated 16:45 and the fresh template PDF was dated 17:46; after copying, both were 3126615 bytes and shared SHA256 `0CE7267131056BB3388010287872C87A79C7FF728C618DB3DB9CF8DA5BDB672F`.
  actual_result: The stale-image report was caused by opening a duplicate top-level PDF rather than by LaTeX using the wrong figure file.
  delta: Synchronized the build output to the path the user had been opening.
  lesson: When a manuscript has duplicated build/output paths, verify the exact PDF path being opened and compare artifact hashes before debugging LaTeX image inclusion.
  next_adjustment: Prefer one canonical PDF output path or automatically synchronize the user-facing copy after every final build.
  evidence:
  - EV-061
  knowledge_candidate: true
- id: WT-030-003
  task_id: TASK-030
  context: The Section 5.1 data-collection paragraph specified the robotic-arm control input, sampling period, trajectory count, and sample contents, but described the soft-platform dataset only by trajectory and sample counts.
  hypothesis: A symmetric platform-by-platform description will make the experiment protocol directly comparable without adding new experimental volume or unsupported technical claims.
  decision_ref: null
  action: Verify the soft-platform acquisition code and source archives, then add its random two-dimensional cable-motion command, 0.2 s sampling period, 100 trajectories of 60 s, and per-sample light-spot/control contents before the shared split statement.
  expected_result: Both platforms have parallel descriptions of excitation signal, sampling period, trajectory count, sample contents, and dataset split while the manuscript remains nine pages.
  observation: The source configuration uses a 0.2 s sampling interval, the archive contains 100 trajectories with 300 two-dimensional state/control samples each, the text appears on page 6, the strict warning scan is empty, and both PDF outputs share SHA256 ED062C84FBDA0740E663CC964C5D65BD42A8A7138444ABA65A79455AE2E091BE.
  actual_result: The data-collection paragraph now reports the platforms symmetrically and preserves the existing split ratios.
  delta: Added the soft-platform input signal, 60 s trajectory duration, and sample contents rather than changing experiments or metrics.
  lesson: When a manuscript compares two experimental platforms, the data-collection paragraph should use the same information fields for each platform so readers can compare protocols directly.
  next_adjustment: Include a platform-field symmetry check in the future paper-revision Skill.
  evidence:
  - EV-062
  knowledge_candidate: true
- id: WT-030-004
  task_id: TASK-030
  context: Section 5.2 introduced the robotic-arm model dimensions immediately and deferred the soft-platform model configuration, so the experimental setup and subsequent result comparisons were asymmetric.
  hypothesis: Separating shared method choices from platform-specific configuration and evaluation will make both platforms equally interpretable before the figures and table are shown.
  decision_ref: null
  action: Recover the soft-platform run configuration, rewrite the opening of Section 5.2 into shared setup plus parallel platform-specific methods, and compile and inspect the affected pages.
  expected_result: Readers see the candidate-library, dictionary, selection-dimension, and evaluation protocol for each platform before any per-platform result is presented, while the manuscript remains nine pages.
  observation: The soft-platform run uses a 112-term library, a 20-dimensional EDMDDL dictionary with 256-by-256 hidden layers, and a 40-dimensional FS-EDMD selection; the revised build is nine pages with an empty strict warning scan, and pages 6-7 render correctly.
  actual_result: Section 5.2 now describes both platform configurations symmetrically before Fig. 4, Fig. 5, and Table 1.
  delta: Replaced the arm-first configuration paragraph with a shared setup statement and parallel arm/soft-platform configuration details.
  lesson: In a cross-platform method comparison, result presentation should only begin after each platform's model configuration and evaluation horizon have been stated with the same information fields.
  next_adjustment: Add a result-order audit that checks all platform configurations precede platform-specific figures and tables in the future paper-revision Skill.
  evidence:
  - EV-063
  knowledge_candidate: true
- id: WT-030-005
  task_id: TASK-030
  context: The in-column `figurehere` environment bypassed the CAS class's renewed figure environment, so its captions inherited a larger default top spacing than ordinary CAS figures.
  hypothesis: Setting the caption top skip inside `figurehere` to the CAS figure default will tighten the visual relationship between each graphic and caption without affecting surrounding layout.
  decision_ref: null
  action: Set `\abovecaptionskip` to 6 pt within `figurehere`, rebuild, scan warnings, render the affected pages, and synchronize the user-facing PDF.
  expected_result: The figure-to-caption gap matches the class style, the manuscript remains nine pages, and no new warnings or placement regressions appear.
  observation: The rebuilt PDF remains nine pages with an empty strict warning scan; pages 6 and 8 show tighter caption spacing with all figure content intact, and both PDF copies share SHA256 1316C8E1BAAD5DB2A36C64D91805E98D388CCF6B3640A8ED81363DE43871B49E.
  actual_result: In-column figure captions now use 6 pt top spacing while Figure 1 and the global caption configuration remain unchanged.
  delta: Added a local `\abovecaptionskip` override only to `figurehere`.
  lesson: When a custom non-floating environment bypasses a document class's redefined float environment, verify caption skips and other class-level formatting rather than assuming inheritance.
  next_adjustment: Include custom-environment caption-spacing checks in the future paper-revision Skill.
  evidence:
  - EV-064
  knowledge_candidate: true
- id: WT-038-001
  task_id: TASK-038
  context: The first bibliography fix used unsrtnat to restore first-citation numbering, but visual comparison with the supplied RAS reference examples showed that the standard unsorted natbib presentation did not match the target numbered Elsevier style.
  hypothesis: A local BibTeX style derived from the official Elsevier numbered style can preserve citation-order numbering while reproducing the target author, journal, volume, issue, year, and page presentation.
  decision_ref: DEC-017
  action: Derive `ras-num.bst` from the official numbered Elsevier style, suppress DOI output, normalize journal abbreviations in `references.bib`, rebuild, compare `main.aux` first-citation order with `main.bbl` order, scan warnings, inspect rendered pages, and synchronize the user-facing PDF.
  expected_result: The bibliography matches the RAS numbered presentation, remains in first-citation order, keeps all existing citation keys, and leaves the manuscript at nine pages.
  observation: The forced main build exits 0 with a nine-page PDF and no actionable warnings; all 25 first-citation keys exactly match the 25 bibliography items in order; the bibliography has no DOI or URL output; and the template and user-facing PDFs share SHA256 8811242B4CD2C624CF5EFD8BD0079961273E7BF74531EA.
  actual_result: The bibliography now uses the local RAS-style numbered presentation without manual reference reordering.
  delta: Replaced the unsorted natbib presentation with a minimal local style derived from the official Elsevier numbered style and disabled DOI output.
  lesson: Citation-order validation and visual-format validation are separate gates; passing one does not prove the other.
  next_adjustment: In a future paper-revision Skill, check numbering order first, then compare rendered bibliography entries against the target journal examples before declaring the reference style complete.
  evidence:
  - EV-069
  knowledge_candidate: true
