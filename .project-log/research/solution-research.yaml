studies:
- id: RES-001
  status: complete
  problem: 为新设备软体平台选择数据准备、约 200 维升维函数库、三类模型训练、10 条测试轨迹评估和配置探索的实现路径。
  related_business_logic:
  - BL-SOFT-001
  - BL-SOFT-002
  - BL-SOFT-003
  - BL-SOFT-004
  - BL-SOFT-005
  - BL-SOFT-006
  - BL-SOFT-007
  - BL-SOFT-008
  - BL-SOFT-009
  - BL-SOFT-010
  related_tasks:
  - TASK-010
  - TASK-011
  - TASK-012
  - TASK-013
  - TASK-014
  - TASK-015
  - TASK-016
  constraints:
  - 代码放在建模代码根目录，不新增 soft_platform 等软体平台专属子文件夹。
  - 数据固定 7:2:1 划分，测试集为固定 10 条轨迹，不参与训练和调参。
  - 状态 x 与控制 u 均为 2D，训练与评估使用 Float64。
  - 升维函数库目标约 200 维，必须包含常数项和 x/y 分量。
  - 实验中的模型、中间数据、指标和图表输出到杂项/软体平台探索实验结果。
  - 不得破坏已完成的机械臂建模代码、数据和模型基线。
  candidates:
  - name: 复用现有 modeling 包并增加软体平台适配层
    source: 建模代码/modeling/*.py 与 scripts/*.py 现状
    capability_match: 可直接复用 FS-EDMD/EDMD/EDMDDL 训练器、指标和实验入口，只需新增 npz 数据管线和 2D 升维函数。
    integration_cost: 低：给训练器增加可选 lift_fn/state_dim/control_dim 参数可兼容机械臂默认行为。
    maintenance_cost: 低：代码仍在一个建模代码工程，避免平铺脚本重复实现。
    performance: 高：训练器、矩阵求解、网络结构均已存在，重点是数据与特征适配。
    reliability: 较高：机械臂基线已通过验证，默认行为兼容可减少回归风险。
    lock_in: 无外部框架依赖。
    risk: 需要保持机械臂模型加载/预测兼容；通过 --check-load 与基线指标回归验证。
    fit: 推荐
  - name: 在建模代码根目录新增平铺软体训练脚本
    source: 现有平铺脚本风格
    capability_match: 可完成软体平台功能，但不复用现有训练器。
    integration_cost: 中高：需要重新实现公共逻辑。
    maintenance_cost: 高：与 modeling 包重复，探索配置调整成本高。
    performance: 中
    reliability: 中
    lock_in: 低
    risk: 平铺脚本容易路径混乱，与现有工程风格不一致。
    fit: 不推荐
  - name: 新建建模代码/soft_platform 子目录
    source: 用户明确要求不创建子文件夹
    capability_match: 可隔离代码，但违反已确认目录约束。
    integration_cost: 中
    maintenance_cost: 中
    performance: 中
    reliability: 中
    lock_in: 低
    risk: 直接与用户确认的 DEC-004 冲突。
    fit: 排除
  - name: 引入第三方 Koopman 库
    source: pykoopman 等通用库，未进入项目依赖
    capability_match: 可提供通用 EDMD/DMD 工具，但本项目需要保留自定义 FS-EDMD 与 EDMDDL 论文算法。
    integration_cost: 高：需要重写训练/保存/预测接口。
    maintenance_cost: 中
    performance: 中
    reliability: 中
    lock_in: 中
    risk: 偏离现有已跑通算法，增加复现不一致风险。
    fit: 不推荐
  strategy: spike-first
  recommendation:
    implementation: 复用现有 modeling 包，新增 soft_data.py 数据管线和 soft_lift.py 2D 升维函数库；为
      FS-EDMD/EDMD 增加可选 lift_fn，EDMDDL 使用可配置维度；新增 scripts/prepare_soft_data.py 和 scripts/run_soft_experiment.py。
    lift_library_baseline: 候选 200 维 = 常数/x/y（3 维）+ 多项式到 4 次（12 维）+ 13x13 高斯 RBF（169
      维）+ 低频 sin/cos（16 维）。
    data_pipeline: 读取 100 条 npz，按固定规则整轨划分 70/20/10，构造 X=x[t]、U=u[t]、Y=x[t+1]，保存 Float64
      npz 到实验输出目录 processed_data。
    evaluation: 每组在同一固定 10 条测试轨迹上逐条递归预测，计算反归一化 xy RMSE，输出逐轨迹表、平均 RMSE 和最高精度。
    spike: 先用候选 200 维特征库跑一个短探索组；若 RBF 条件数导致不稳定，再调整中心网格、宽度、标准化、正则或 PCA 截断。
  conditions:
  - 若用户要求完全不改动现有训练器文件，则改为在建模代码根目录新增包装/适配脚本。
  - 若 200 维候选特征库在冒烟中数值不稳定，应先调整 RBF、标准化和正则，再进入全量探索。
  - 若仅状态升维不足，可增加状态-控制联合或控制相关特征并记录为新探索变量。
  contrary_evidence:
  - 现有 lift_function 针对 6 维机械臂状态实现，对 2 维输入无法直接使用。
  - 现有 data_io 读取 mat，不能直接读取软体平台 npz 原始数据。
  - 线性近似残差 RMSE 约 0.118，不能仅保留线性项。
  confidence: 0.85
  decision_ref: DEC-005
  sources:
  - 建模代码/modeling/lift_function.py
  - 建模代码/modeling/data_io.py
  - 建模代码/modeling/trainers/fs_edmd.py
  - 建模代码/modeling/trainers/edmddl.py
  - 建模代码/modeling/trainers/edmd.py
  - 数据备份/软体平台/原始数据/*.npz 只读统计
